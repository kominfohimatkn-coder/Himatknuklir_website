services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: himatkn
      MYSQL_USER: ${MYSQL_APP_USER:?set MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_APP_USER -p$$MYSQL_APP_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: himatkn
      DB_USER: ${MYSQL_APP_USER:?set MYSQL_APP_USER}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}
      DB_CHARSET: utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-himatkn-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-himatkn-admin}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?set ADMIN_DEFAULT_PASSWORD}
      ADMIN_DEFAULT_ROLE: ${ADMIN_DEFAULT_ROLE:-superadmin}
      AUTO_CREATE_TABLES: "false"
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?set TRUSTED_PROXY_IPS}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      FASTAPI_BASE_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads:
